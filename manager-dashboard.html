<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<title>ConnectWise — Sales Manager Coaching Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
  :root {
    color-scheme: light;
    --surface-1:      #ffffff;
    --surface-2:      #f7f9fc;
    --page:           #f1f4f8;
    --text-primary:   #0b0b0b;
    --text-secondary: #46505e;
    --text-muted:     #898781;
    --grid:           #e0e6ee;
    --baseline:       #c3ccd8;
    --border:         rgba(11,11,11,0.10);

    --series-1: #2A65AB; /* ConnectWise blue */
    --series-1-soft: rgba(42,101,171,0.10);

    --status-good:     #0ca30c;
    --status-warning:  #fab219;
    --status-serious:  #ec835a;
    --status-critical: #d03b3b;

    --delta-good: #006300;
    --delta-bad:  #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --surface-2:      #202020;
      --page:           #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --grid:           #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --series-1: #4A86D0;
      --series-1-soft: rgba(74,134,208,0.20);
      --delta-good: #0ca30c;
      --delta-bad:  #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --surface-2:      #202020;
    --page:           #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --grid:           #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --series-1: #4A86D0;
    --series-1-soft: rgba(74,134,208,0.20);
    --delta-good: #0ca30c;
    --delta-bad:  #e66767;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 28px 20px 80px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }

  /* ---------- header ---------- */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .topbar h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
  .topbar .meta { font-size: 13.5px; color: var(--text-secondary); }
  .topbar .meta .dot-sep { margin: 0 6px; color: var(--text-muted); }
  .sim-tag {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
    color: var(--text-muted); border: 1px solid var(--border);
    border-radius: 999px; padding: 2px 9px; margin-top: 8px;
  }
  .actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .btn {
    font-family: inherit; cursor: pointer; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface-1);
    color: var(--text-primary); font-size: 13px; padding: 8px 14px;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .btn-primary {
    background: var(--series-1); border-color: var(--series-1); color: #fff; font-weight: 600;
  }
  .btn-primary:active { opacity: 0.85; }

  /* ---------- section shell ---------- */
  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
  }
  section { margin-bottom: 22px; }
  .section-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 12px; flex-wrap: wrap; gap: 6px;
  }
  .section-head h2 { font-size: 15px; font-weight: 700; margin: 0; }
  .section-head .sub { font-size: 12.5px; color: var(--text-muted); }
  .link-btn {
    font-family: inherit; background: none; border: none; cursor: pointer;
    color: var(--series-1); font-size: 12.5px; font-weight: 600; padding: 0;
  }

  /* ---------- stat tiles ---------- */
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 920px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) { .stat-grid { grid-template-columns: 1fr; } }
  .stat-tile { padding: 16px 18px; }
  .stat-label { font-size: 12.5px; color: var(--text-secondary); margin-bottom: 8px; }
  .stat-value { font-size: 28px; font-weight: 700; line-height: 1.1; font-variant-numeric: proportional-nums; }
  .stat-sub { font-size: 12px; color: var(--text-muted); margin-top: 6px; }

  /* ---------- priority list ---------- */
  .priority-list { display: flex; flex-direction: column; gap: 10px; }
  .priority-item {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 13px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2);
  }
  .priority-rank {
    flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%;
    background: var(--grid); color: var(--text-secondary);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
  }
  .priority-body { flex: 1; min-width: 0; }
  .priority-text { font-size: 13.5px; line-height: 1.5; }
  .priority-text b { font-weight: 700; }
  .priority-meta { margin-top: 5px; display: flex; gap: 10px; flex-wrap: wrap; }

  /* ---------- badges ---------- */
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; color: var(--text-primary);
    white-space: nowrap;
  }
  .badge-dot {
    width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 10px; font-weight: 800; line-height: 1;
  }
  .meta-chip {
    font-size: 11.5px; color: var(--text-muted); border: 1px solid var(--border);
    border-radius: 999px; padding: 2px 8px;
  }

  /* ---------- meters ---------- */
  .meter-row { display: grid; grid-template-columns: 128px 1fr 76px; align-items: center; gap: 10px; margin-bottom: 9px; }
  .meter-row:last-child { margin-bottom: 0; }
  .meter-label { font-size: 12.5px; color: var(--text-secondary); }
  .meter-track { height: 8px; border-radius: 4px; background: var(--grid); overflow: hidden; }
  .meter-fill { height: 100%; border-radius: 4px; }
  .meter-value { font-size: 12px; font-weight: 600; text-align: right; display: flex; align-items: center; justify-content: flex-end; gap: 5px; }

  /* ---------- rep roster ---------- */
  .rep-card { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; background: var(--surface-1); overflow: hidden; }
  .rep-card:last-child { margin-bottom: 0; }
  .rep-head {
    display: grid; grid-template-columns: 1.4fr 1fr 1.6fr 24px;
    align-items: center; gap: 16px; padding: 16px 18px; cursor: pointer;
  }
  @media (max-width: 860px) {
    .rep-head { grid-template-columns: 1.2fr 1fr 24px; }
    .rep-head .col-meters { display: none; }
  }
  .rep-head:hover { background: var(--series-1-soft); }
  .rep-identity .rep-name { font-weight: 700; font-size: 14.5px; }
  .rep-identity .rep-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
  .rep-pipeline { font-size: 12.5px; color: var(--text-secondary); line-height: 1.5; }
  .rep-pipeline b { color: var(--text-primary); font-weight: 700; font-variant-numeric: tabular-nums; }
  .col-meters { display: flex; gap: 14px; flex-wrap: wrap; }
  .mini-meter { display: flex; flex-direction: column; gap: 4px; min-width: 86px; }
  .mini-meter .mm-label { font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.02em; }
  .mini-meter .mm-track { height: 6px; border-radius: 3px; background: var(--grid); overflow: hidden; }
  .mini-meter .mm-fill { height: 100%; border-radius: 3px; }
  .caret { color: var(--text-muted); font-size: 13px; transition: transform 0.15s; justify-self: end; }
  .caret.open { transform: rotate(90deg); }

  .rep-detail { padding: 4px 18px 20px; border-top: 1px solid var(--border); }
  .detail-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 14px; }
  @media (max-width: 760px) { .detail-cols { grid-template-columns: 1fr; } }
  .detail-h { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); margin: 16px 0 9px; }
  .detail-h:first-child { margin-top: 14px; }

  /* ---------- deal mini rows ---------- */
  .mini-deal { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); margin-bottom: 7px; }
  .mini-deal:last-child { margin-bottom: 0; }
  .mini-deal .md-left { min-width: 0; }
  .mini-deal .md-acct { font-size: 12.5px; font-weight: 600; }
  .mini-deal .md-sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  .mini-deal .md-right { text-align: right; flex-shrink: 0; }
  .mini-deal .md-amt { font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }

  .pillar-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .pillar-chip {
    display: inline-flex; align-items: center; gap: 5px;
    border: 1px solid var(--border); border-radius: 999px; padding: 3px 8px 3px 6px;
    font-size: 11px; background: var(--surface-1);
  }
  .pillar-chip .code { font-weight: 700; font-size: 9.5px; color: var(--text-muted); }
  .pillar-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  /* ---------- citations ---------- */
  .citation {
    border-left: 3px solid var(--series-1);
    background: var(--surface-2);
    border-radius: 0 8px 8px 0;
    padding: 10px 13px;
    margin-bottom: 10px;
    font-size: 13px;
  }
  .citation:last-child { margin-bottom: 0; }
  .citation .quote { color: var(--text-primary); line-height: 1.5; font-style: italic; }
  .citation .cite-meta { margin-top: 6px; font-size: 11.5px; color: var(--text-muted); display: flex; gap: 8px; flex-wrap: wrap; }
  .citation .cite-pillar { font-weight: 600; font-style: normal; }

  /* ---------- coaching plan ---------- */
  .plan-item {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 9px 0; border-top: 1px solid var(--border);
  }
  .plan-item:first-child { border-top: none; padding-top: 0; }
  .plan-status-dot {
    flex-shrink: 0; width: 15px; height: 15px; border-radius: 50%; margin-top: 1px;
    display: flex; align-items: center; justify-content: center; font-size: 9px; color: #fff; font-weight: 800;
  }
  .plan-body { flex: 1; min-width: 0; font-size: 12.5px; line-height: 1.5; }
  .plan-body .plan-comp { font-weight: 700; color: var(--text-primary); }
  .plan-foot { margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; font-size: 11px; color: var(--text-muted); }

  footer {
    margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--text-muted); line-height: 1.6;
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--baseline); border-radius: 4px; }
  .brand-logo { height: 30px; width: auto; display: block; margin-bottom: 14px; background: #fff; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border); }
  .brand-bar { height: 3px; background: var(--series-1); border-radius: 3px; margin: 0 0 18px; }
</style>
</head>

<script>
const h = React.createElement;
const { useState } = React;

/* ============================= DATA POOLS ============================= */

const MANAGER_PROFILE = { name: 'Dana Whitfield', title: 'Manager, MSP Sales', segment: 'North America — Growth MSP' };

const REP_NAMES = ['Avery Collins','Priya Nair','Marcus Webb','Dana Cole','Alex Kim'];
const TENURE_OPTIONS = ['4 months','11 months','1.5 years','2 years','3.5 years'];
const ACCOUNTS = ['Northbridge Managed Services','Summit IT Partners','Harborlight Technologies','Redwood Managed IT','Crestline Cyber Group','BlueFin Networks','Granite Peak IT','Lumen Systems Group','Ironclad MSP','Pinecrest Tech Services','Keystone Digital Group','Cascade Managed Services','Beacon Technology Partners','Atlas Cloudworks','Meridian IT Group'];
const COMPETITORS = ['N-able','Kaseya','NinjaOne','HaloPSA','Syncro'];
const CALL_TITLES_DEAL = ['Discovery Call','Platform Demo','Security & Compliance Review','Migration Planning','Pricing & Packaging','Pilot Check-in'];
const CONTACTS = [
  { name:'Priya R.', role:'CEO / Founder' },
  { name:'Sam B.', role:'Director of Operations' },
  { name:'Elena R.', role:'vCISO / Head of Security' },
  { name:'Lena Ford', role:'CFO' },
  { name:'Omar Haddad', role:'VP of Client Services' },
  { name:'Grace Lin', role:'NOC Manager' },
];

const PILLAR_DEFS = [
  { key:'metrics', label:'Metrics', code:'M' },
  { key:'economicBuyer', label:'Economic Buyer', code:'EB' },
  { key:'decisionCriteria', label:'Decision Criteria', code:'DC' },
  { key:'decisionProcess', label:'Decision Process', code:'DP' },
  { key:'paperProcess', label:'Paper Process', code:'PP' },
  { key:'identifyPain', label:'Identify Pain', code:'IP' },
  { key:'champion', label:'Champion', code:'CH' },
  { key:'competition', label:'Competition', code:'CO' },
];

/* Behavioral competencies — sourced from coaching-data-hydration/competencies/
   09_talk_listen_ratio.md, 10_next_steps_commitment.md, 11_objection_handling.md */
const COMPETENCY_DEFS = [
  { key:'talkListen', label:'Talk/Listen Ratio', short:'Talk/Listen' },
  { key:'nextSteps', label:'Next Steps & Commitment', short:'Next Steps' },
  { key:'objectionHandling', label:'Objection Handling', short:'Objections' },
];

/* Rep-voice citations — modeled on each competency file's positive/negative indicators */
const COMPETENCY_CITATION_TEMPLATES = {
  talkListen: {
    strong: [
      () => `So just to make sure I'm tracking — when you said migration is the worry, do you mean downtime for clients, or retraining your techs?`,
      () => `Take your time — I want to understand how your service desk works day to day before I show you anything.`,
    ],
    developing: [
      () => `Right, and — yeah — so what ConnectWise does differently is, well let me walk you through the whole platform first and then we can...`,
    ],
    weak: [
      () => `Let me just finish the platform demo, then we can get to questions at the end.`,
    ],
  },
  nextSteps: {
    strong: [
      () => `So the next step is a 100-endpoint pilot on your healthcare clients — can we lock the kickoff for Thursday the 14th at 2pm with your ops director?`,
      () => `I'll send the migration plan and Pax8 order form by Friday — can you confirm your vCISO is on that thread?`,
    ],
    developing: [
      () => `Let's plan to touch base again sometime next month once you've talked it through internally.`,
    ],
    weak: [
      () => `Okay, sounds good — I'll just follow up in a few weeks and see where things stand.`,
    ],
  },
  objectionHandling: {
    strong: [
      () => `That's a fair point on the N-able renewal discount — let me understand what's working with your current RMM before I talk about where we're different.`,
      () => `Totally hear you on migration effort — is it client downtime, tech retraining, or the cutover timeline?`,
    ],
    developing: [
      () => `I mean, I get that, but honestly the ConnectWise platform just does it better than what you have today.`,
    ],
    weak: [
      () => `Yeah, I hear you — happy to come back to this when your renewal is closer, no pressure.`,
    ],
  },
};

const MEDDPICC_CITATION_TEMPLATES = {
  metrics: {
    covered: () => `Moving RMM and security onto one platform takes our tooling spend from about $1.2M to under $950K and frees up two techs — I already ran the math with finance.`,
    partial: () => `We think consolidating saves tech hours, but I haven't built the per-endpoint margin model finance will want.`,
    missing: () => `Honestly, we haven't quantified what the tool sprawl costs us — it just feels like it would help.`,
  },
  economicBuyer: {
    covered: () => `I own the stack decision and I've already cleared the budget with my CFO.`,
    partial: () => `Our COO would need to bless the migration, but I haven't looped them in yet.`,
    missing: () => `Our owner makes the final call on vendors and I haven't gotten in front of them.`,
  },
  decisionCriteria: {
    covered: () => `Managed SOC/MDR access, a clean RMM migration path, and per-endpoint pricing at or under our current rate are the three boxes — you're clear on all three.`,
    partial: () => `We're still finalizing how we'll score vendors on security depth versus price.`,
    missing: () => `Honestly, we haven't written down what we're grading vendors on yet.`,
  },
  decisionProcess: {
    covered: () => `Ops reviews the migration plan, then I take it to leadership — pilot results land before our renewal date.`,
    partial: () => `We haven't agreed how the pilot results feed the final decision.`,
    missing: () => `We haven't mapped out who needs to sign off after operations.`,
  },
  paperProcess: {
    covered: () => `The order form is down to one clause — term length versus our renewal date — and Pax8 can provision in 30 days.`,
    partial: () => `Our legal team is just starting to look at the order form.`,
    missing: () => `We haven't sent paper to legal yet, and I'm not sure how the distributor handles provisioning.`,
  },
  identifyPain: {
    covered: () => `My techs are swivel-chairing across four tools and clients keep asking for a managed SOC we can't deliver — that's why I'm on this call.`,
    partial: () => `There's some frustration with the tool sprawl, but it's not acute yet.`,
    missing: () => `The stack we have works fine for us today, if I'm honest.`,
  },
  champion: {
    covered: () => `My vCISO and ops lead are both asking when we can start the pilot — I'm pushing hard internally.`,
    partial: () => `I like it, but I haven't socialized the migration with my service desk yet.`,
    missing: () => `I'm just one voice in this — operations has the real say and they're skeptical.`,
  },
  competition: {
    covered: (ctx) => `We looked at ${ctx.competitor} early and ruled them out — their security stack didn't fit how we sell to our healthcare clients.`,
    partial: (ctx) => `We're still quietly evaluating ${ctx.competitor} alongside you, and their renewal offer is sharp.`,
    missing: () => `I can't share who else we're talking to right now.`,
  },
};

/* Coaching-plan action phrasing modeled on each competency file's "Example Coaching Feedback Prompts" */
const PLAN_ACTION_TEMPLATES = {
  talkListen: [
    (ctx) => `Review the first 10 minutes of the ${ctx.callTitle} call and flag where a question about client mix could've replaced a feature walkthrough.`,
    () => `Shadow one discovery call this week — target rep talk time under 40%, per the Discovery Call benchmark.`,
    () => `Practice pause discipline: after asking a question, count to three before adding anything.`,
  ],
  nextSteps: [
    () => `Role-play locking the pilot kickoff date live on the call instead of leaving scheduling to a follow-up email.`,
    (ctx) => `On the next call with ${ctx.account}, assign the buyer pre-work — a current tool inventory and endpoint count — before the next meeting.`,
    () => `Audit the last 5 call recaps — confirm each named a specific owner, action, and date, not "I'll follow up."`,
  ],
  objectionHandling: [
    (ctx) => `Debrief the ${ctx.competitor} objection on the ${ctx.account} call — build a contrast statement around platform unification that doesn't lean on FUD.`,
    () => `Practice acknowledge-then-clarify on renewal-discount objections before offering any commercial flexibility.`,
    () => `Loop in the solutions engineer proactively on the next migration or security-review objection instead of answering solo.`,
  ],
};

const STATUS_META = {
  strong:     { label:'Strong',     varName:'--status-good' },
  developing: { label:'Developing', varName:'--status-warning' },
  weak:       { label:'Needs Focus',varName:'--status-critical' },
};
const PILLAR_STATUS_META = {
  covered: { label:'Covered', varName:'--status-good' },
  partial: { label:'Partial', varName:'--status-warning' },
  missing: { label:'Missing', varName:'--text-muted' },
};
const PLAN_STATUS_META = {
  'Not Started': { varName:'--text-muted', icon:'·' },
  'In Progress': { varName:'--status-warning', icon:'!' },
  'Done':         { varName:'--status-good', icon:'✓' },
};

const STAGES = ['Discovery','Pilot & Design','Proposal','Negotiation','Verbal Commit'];

/* ============================= HELPERS ============================= */

const rand = (min, max) => Math.random() * (max - min) + min;
const randInt = (min, max) => Math.floor(rand(min, max + 1));
const pick = (arr) => arr[randInt(0, arr.length - 1)];
function shuffledCopy(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = randInt(0, i); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function pickN(arr, n) { return shuffledCopy(arr).slice(0, n); }
function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function fmtMoney(n) {
  const abs = Math.abs(n), sign = n < 0 ? '-' : '';
  if (abs >= 1e6) { const v = abs / 1e6; return sign + '$' + (Math.round(v * 10) % 10 === 0 ? v.toFixed(0) : v.toFixed(1)) + 'M'; }
  if (abs >= 1e3) { const v = abs / 1e3; return sign + '$' + Math.round(v) + 'K'; }
  return sign + '$' + Math.round(abs).toLocaleString('en-US');
}
function fmtDateShort(d) { return d.toLocaleDateString('en-US', { month:'short', day:'numeric' }); }
function fmtDateLong(d) { return d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' }); }

/* ============================= GENERATION ============================= */

function weightedPillarStatus() {
  const r = Math.random();
  if (r < 0.5) return 'covered';
  if (r < 0.8) return 'partial';
  return 'missing';
}
function weightedCompetencyStatus() {
  const r = Math.random();
  if (r < 0.45) return 'strong';
  if (r < 0.8) return 'developing';
  return 'weak';
}
function scoreForStatus(status) {
  if (status === 'strong' || status === 'covered') return randInt(80, 97);
  if (status === 'developing' || status === 'partial') return randInt(45, 72);
  return randInt(12, 38);
}

function buildRepDeal(id, repName) {
  const today = startOfDay(new Date());
  const closeDate = startOfDay(addDays(today, randInt(5, 120)));
  const amount = Math.round(rand(60000, 700000) / 10000) * 10000;
  const account = pick(ACCOUNTS);
  const stage = pick(STAGES);
  const pillars = PILLAR_DEFS.map(def => ({ key: def.key, status: weightedPillarStatus() }));
  const coveredCount = pillars.filter(p => p.status === 'covered').length;

  let candidates = pillars.filter(p => p.status !== 'covered');
  if (candidates.length === 0) candidates = pillars.slice();
  const citePillar = pick(candidates);
  const def = PILLAR_DEFS.find(d => d.key === citePillar.key);
  const quote = MEDDPICC_CITATION_TEMPLATES[citePillar.key][citePillar.status]({ competitor: pick(COMPETITORS), account });
  const speaker = pick(CONTACTS);

  return {
    id: 'deal_' + repName.replace(/\s/g,'') + '_' + id,
    account, amount, stage, closeDate,
    pillars, coveredCount,
    citation: {
      pillarLabel: def.label, quote,
      speakerName: speaker.name, speakerRole: speaker.role,
      date: addDays(today, -randInt(1, 20)), callTitle: pick(CALL_TITLES_DEAL),
    },
  };
}

function buildCompetency(key, rep, dealAccount) {
  const def = COMPETENCY_DEFS.find(c => c.key === key);
  const status = weightedCompetencyStatus();
  const score = scoreForStatus(status);
  const citeStatus = status === 'strong' ? 'strong' : (status === 'developing' ? 'developing' : 'weak');
  const quoteFn = pick(COMPETENCY_CITATION_TEMPLATES[key][citeStatus]);
  const today = startOfDay(new Date());
  const citation = {
    competencyLabel: def.label, quote: quoteFn({ account: dealAccount, competitor: pick(COMPETITORS) }),
    date: addDays(today, -randInt(1, 20)), callTitle: pick(CALL_TITLES_DEAL),
  };
  return { key, label: def.label, status, score, citation };
}

function buildCoachingPlan(competencies, repDeals) {
  const weakest = competencies.slice().sort((a, b) => a.score - b.score);
  const targets = weakest.slice(0, randInt(2, 3));
  const today = startOfDay(new Date());
  const statuses = ['Not Started', 'In Progress', 'Done'];
  return targets.map((comp, i) => {
    const templates = PLAN_ACTION_TEMPLATES[comp.key];
    const actionFn = pick(templates);
    const deal = repDeals.length ? pick(repDeals) : { account: 'their active pipeline', citation: { callTitle: 'recent call' } };
    const action = actionFn({ account: deal.account, callTitle: deal.citation ? deal.citation.callTitle : 'recent call', competitor: pick(COMPETITORS) });
    return {
      id: 'plan_' + i,
      competency: comp.label,
      action,
      owner: MANAGER_PROFILE.name,
      dueDate: addDays(today, randInt(3, 21)),
      status: i === 0 ? pick(['Not Started','In Progress']) : pick(statuses),
    };
  });
}

function buildRep(index) {
  const name = REP_NAMES[index];
  const tenure = TENURE_OPTIONS[index % TENURE_OPTIONS.length];
  const quotaAttainment = randInt(55, 118);
  const dealCount = randInt(2, 4);
  const deals = Array.from({ length: dealCount }, (_, i) => buildRepDeal(i, name));
  const pipeline = deals.reduce((s, d) => s + d.amount, 0);
  const winRate = randInt(28, 70);
  const avgMeddpicc = Math.round(deals.reduce((s, d) => s + d.coveredCount, 0) / (deals.length * 8) * 100);

  const sampleAccount = deals.length ? deals[0].account : 'their pipeline';
  const competencies = COMPETENCY_DEFS.map(def => buildCompetency(def.key, name, sampleAccount));
  const coachingPlan = buildCoachingPlan(competencies, deals);

  const avgCompetencyScore = Math.round(competencies.reduce((s, c) => s + c.score, 0) / competencies.length);
  const overallHealth = Math.round((avgMeddpicc + avgCompetencyScore) / 2);

  return {
    id: 'rep_' + index, name, tenure, quotaAttainment,
    deals, pipeline, winRate, avgMeddpicc,
    competencies, coachingPlan, avgCompetencyScore, overallHealth,
  };
}

function generateCoachingView() {
  const reps = REP_NAMES.map((_, i) => buildRep(i));
  const teamPipeline = reps.reduce((s, r) => s + r.pipeline, 0);
  const teamWinRate = Math.round(reps.reduce((s, r) => s + r.winRate, 0) / reps.length);
  const teamAvgMeddpicc = Math.round(reps.reduce((s, r) => s + r.avgMeddpicc, 0) / reps.length);
  const flaggedCount = reps.filter(r => r.overallHealth < 55 || r.competencies.some(c => c.status === 'weak')).length;

  const priorities = [];
  reps.forEach(rep => {
    rep.competencies.forEach(comp => {
      if (comp.status === 'weak') {
        priorities.push({
          rep, competency: comp,
          text: `${rep.name} is trending weak on ${comp.label} (score ${comp.score}) — "${comp.citation.quote.slice(0, 70)}${comp.citation.quote.length > 70 ? '…' : ''}"`,
          severity: 3,
        });
      }
    });
    if (rep.avgMeddpicc < 40) {
      priorities.push({
        rep, competency: null,
        text: `${rep.name}'s open deals average only ${rep.avgMeddpicc}% MEDDPICC coverage — pipeline quality risk heading into the quarter.`,
        severity: 2,
      });
    }
  });
  priorities.sort((a, b) => b.severity - a.severity);

  return {
    manager: MANAGER_PROFILE,
    generatedAt: new Date(),
    reps,
    stats: { teamPipeline, teamWinRate, teamAvgMeddpicc, flaggedCount,
      securityAttach: randInt(49, 66), shareOfStack: randInt(34, 47), netNewArr: Math.round(teamPipeline * 0.18 / 10000) * 10000, grr: randInt(91, 97) },
    priorities: priorities.slice(0, 5),
  };
}

/* ============================= COMPONENTS ============================= */

function StatusDot({ varName, icon }) {
  return h('span', { className:'badge-dot', style:{ background:`var(${varName})` } }, icon || '');
}
function CompetencyBadge({ status }) {
  const meta = STATUS_META[status];
  return h('span', { className:'badge' }, h(StatusDot, { varName: meta.varName, icon: status === 'weak' ? '!' : (status === 'strong' ? '✓' : '·') }), meta.label);
}

function StatTile({ label, value, sub }) {
  return h('div', { className:'card stat-tile' },
    h('div', { className:'stat-label' }, label),
    h('div', { className:'stat-value' }, value),
    sub ? h('div', { className:'stat-sub' }, sub) : null
  );
}

function PriorityItem({ item, rank, onJump }) {
  return h('div', { className:'priority-item' },
    h('div', { className:'priority-rank' }, rank),
    h('div', { className:'priority-body' },
      h('div', { className:'priority-text' }, item.text),
      h('div', { className:'priority-meta' },
        h('span', { className:'meta-chip' }, item.rep.name),
        item.competency ? h('span', { className:'meta-chip' }, item.competency.label) : null,
        h('button', { className:'link-btn', onClick: () => onJump(item.rep.id) }, 'View rep ↓')
      )
    )
  );
}

function Meter({ label, score, status, statusMeta }) {
  const meta = statusMeta[status];
  return h('div', { className:'meter-row' },
    h('div', { className:'meter-label' }, label),
    h('div', { className:'meter-track' }, h('div', { className:'meter-fill', style:{ width: score + '%', background:`var(${meta.varName})` } })),
    h('div', { className:'meter-value' }, score, h(StatusDot, { varName: meta.varName }))
  );
}

function MiniMeter({ label, score, varName }) {
  return h('div', { className:'mini-meter' },
    h('div', { className:'mm-label' }, label),
    h('div', { className:'mm-track' }, h('div', { className:'mm-fill', style:{ width: score + '%', background:`var(${varName})` } }))
  );
}

function PillarChip({ pillar }) {
  const def = PILLAR_DEFS.find(d => d.key === pillar.key);
  const meta = PILLAR_STATUS_META[pillar.status];
  return h('span', { className:'pillar-chip', title: `${def.label}: ${meta.label}` },
    h('span', { className:'pillar-dot', style:{ background: `var(${meta.varName})` } }),
    h('span', { className:'code' }, def.code), def.label
  );
}

function MiniDeal({ deal }) {
  return h('div', { className:'mini-deal' },
    h('div', { className:'md-left' },
      h('div', { className:'md-acct' }, deal.account),
      h('div', { className:'md-sub' }, `${deal.stage} · closes ${fmtDateShort(deal.closeDate)} · ${deal.coveredCount}/8 MEDDPICC`),
      h('div', { className:'pillar-grid' }, ...deal.pillars.map(p => h(PillarChip, { key: p.key, pillar: p })))
    ),
    h('div', { className:'md-right' }, h('div', { className:'md-amt' }, fmtMoney(deal.amount)))
  );
}

function Citation({ title, quote, meta }) {
  return h('div', { className:'citation' },
    h('div', { className:'quote' }, `“${quote}”`),
    h('div', { className:'cite-meta' },
      h('span', { className:'cite-pillar' }, title),
      ...meta.map((m, i) => h('span', { key: i }, m))
    )
  );
}

function PlanItem({ item }) {
  const meta = PLAN_STATUS_META[item.status];
  return h('div', { className:'plan-item' },
    h('div', { className:'plan-status-dot', style:{ background:`var(${meta.varName})` } }, meta.icon),
    h('div', { className:'plan-body' },
      h('span', { className:'plan-comp' }, item.competency), ' — ', item.action,
      h('div', { className:'plan-foot' },
        h('span', null, `Owner: ${item.owner}`),
        h('span', null, `Due ${fmtDateShort(item.dueDate)}`),
        h('span', null, item.status)
      )
    )
  );
}

function RepCard({ rep, expanded, onToggle }) {
  const healthVar = rep.overallHealth >= 70 ? '--status-good' : rep.overallHealth >= 45 ? '--status-warning' : '--status-critical';
  return h('div', { className:'rep-card', id: `rep-${rep.id}` },
    h('div', { className:'rep-head', onClick: () => onToggle(rep.id) },
      h('div', { className:'rep-identity' },
        h('div', { className:'rep-name' }, rep.name),
        h('div', { className:'rep-sub' }, `${rep.tenure} tenure · ${rep.quotaAttainment}% quota`)
      ),
      h('div', { className:'rep-pipeline' },
        h('b', null, fmtMoney(rep.pipeline)), ` pipeline · `, h('b', null, rep.deals.length), ` deals`,
        h('div', null, `${rep.winRate}% win rate`)
      ),
      h('div', { className:'col-meters' },
        h(MiniMeter, { label:'MEDDPICC', score: rep.avgMeddpicc, varName: rep.avgMeddpicc >= 60 ? '--status-good' : rep.avgMeddpicc >= 35 ? '--status-warning' : '--status-critical' }),
        ...rep.competencies.map(c => h(MiniMeter, { key: c.key, label: COMPETENCY_DEFS.find(d=>d.key===c.key).short, score: c.score, varName: STATUS_META[c.status].varName }))
      ),
      h('div', { className:`caret ${expanded ? 'open' : ''}` }, '›')
    ),
    expanded ? h('div', { className:'rep-detail' },
      h('div', { className:'detail-h' }, 'Coaching health'),
      h(Meter, { label:'MEDDPICC avg', score: rep.avgMeddpicc, status: rep.avgMeddpicc >= 60 ? 'strong' : rep.avgMeddpicc >= 35 ? 'developing' : 'weak', statusMeta: STATUS_META }),
      ...rep.competencies.map(c => h(Meter, { key: c.key, label: c.label, score: c.score, status: c.status, statusMeta: STATUS_META })),

      h('div', { className:'detail-cols' },
        h('div', null,
          h('div', { className:'detail-h' }, 'Deals in play'),
          ...rep.deals.map(d => h(MiniDeal, { key: d.id, deal: d }))
        ),
        h('div', null,
          h('div', { className:'detail-h' }, 'Momentum call evidence'),
          ...rep.competencies.map(c => h(Citation, {
            key: c.key, title: `${c.label} — ${STATUS_META[c.status].label}`,
            quote: c.citation.quote,
            meta: [`${c.citation.callTitle} · ${fmtDateShort(c.citation.date)}`]
          })),
          rep.deals[0] ? h(Citation, {
            key: 'deal-cite', title: `${rep.deals[0].citation.pillarLabel} (${rep.deals[0].account})`,
            quote: rep.deals[0].citation.quote,
            meta: [`${rep.deals[0].citation.speakerName} · ${rep.deals[0].citation.speakerRole}`, `${rep.deals[0].citation.callTitle} · ${fmtDateShort(rep.deals[0].citation.date)}`]
          }) : null
        )
      ),

      h('div', { className:'detail-h' }, 'Coaching plan'),
      h('div', { className:'card', style:{ padding:'4px 14px' } },
        ...rep.coachingPlan.map(p => h(PlanItem, { key: p.id, item: p }))
      )
    ) : null
  );
}

      ...data.reps.map(rep => h(RepCard, {
        key: rep.id, rep, expanded: expandedId === rep.id,
        onToggle: (id) => setExpandedId(cur => cur === id ? null : id)
      }))
    ),

    h('footer', null,
      `All names, accounts, scores, and call quotes on this page are synthetically generated for demo purposes and do not represent real Salesforce or Momentum data. Click Regenerate for a fresh scenario. Generated ${data.generatedAt.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' })}.`
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
